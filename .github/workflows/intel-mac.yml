name: Intel Mac build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Intel preview if this version has no public release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: intel-mac-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Fetch verified Intel build inputs
        run: python3 scripts/bootstrap_intel.py
      - name: Build native Intel app from source
        run: build/toolchains/python/bin/python3 -B src/native-support/build.py > build/build-output.txt 2>&1
      - name: Run all checks and preserve the exact OCR limitation
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 Amua.app/Contents/Resources/python/bin/python3 -B tests/hardening/run_release_checks.py > evidence/release-checks-output.txt 2>&1
          check_status=$?
          set -e
          printf 'Full check runner exit: %s\n' "$check_status"
          python3 scripts/verify_release.py
      - name: Build and read back installation DMG and source archive
        run: python3 scripts/package_intel.py
      - name: Publish Intel preview with checked assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-intel]')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
      - name: Sync reviewed wiki pages when initialized
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_wiki.py
      - name: Retain exact checks and package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: Intel-Mac-build-and-evidence
          path: |
            dist/
            evidence/
            build/build-output.txt
            build/build-manifest.json
            build/toolchain-provenance.json
          if-no-files-found: warn
          retention-days: 14
