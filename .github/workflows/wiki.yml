name: Sync wiki
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/wiki/**, scripts/sync_wiki.py]
permissions:
  contents: write
jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - name: Publish reviewed wiki pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_wiki.py
